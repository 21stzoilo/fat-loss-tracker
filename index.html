<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fat Loss Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f7f4; font-family: 'DM Mono', 'Courier New', monospace; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .btn { cursor: pointer; border: none; border-radius: 4px; font-family: inherit; font-size: 12px; padding: 5px 10px; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.8; }
    .drag-over { outline: 2px dashed #1a1a2e; outline-offset: -2px; border-radius: 6px; }
    select, input { font-family: inherit; }
    .week-header { cursor: pointer; user-select: none; }
    .week-header:hover { filter: brightness(0.97); }
    .day-row input { background: transparent; border: none; border-bottom: 1px solid #e0e0e0; border-radius: 0; padding: 2px 4px; text-align: right; font-size: 11px; font-family: inherit; color: #1a1a2e; outline: none; }
    .day-row input:focus { border-bottom-color: #1a1a2e; }
    .override-input { background: #fffde7 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const SUPABASE_URL = "https://qkzwhjdqyrtuuwwieftj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OLlLCMvJgE4IjCnPlPKJSQ_F5dJ-eYo";
    const TABLE = "fat_loss_tracker";
    const ROW_ID = "main";

    async function sbGet() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${ROW_ID}&select=data`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) return null;
        const rows = await res.json();
        return rows.length > 0 ? rows[0].data : null;
      } catch { return null; }
    }

    async function sbSave(data) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" },
          body: JSON.stringify({ id: ROW_ID, data, updated_at: new Date().toISOString() })
        });
        return res.ok;
      } catch { return false; }
    }

    const COLORS = {
      deficit:     { bg: "#e8f5e9", border: "#81c784", text: "#2e7d32", rowBg: "#f1f8f1" },
      maintenance: { bg: "#e3f2fd", border: "#64b5f6", text: "#1565c0", rowBg: "#f0f6fd" },
    };

    const MACROS = ["protein","carbs","fat","fiber"];
    const MACRO_LABELS = { protein:"Protein", carbs:"Carbs", fat:"Fat", fiber:"Fiber" };
    const MACRO_KCAL   = { protein:4, carbs:4, fat:9, fiber:0 };

    function calcKcal(m) {
      if (!m) return 0;
      return Object.entries(MACRO_KCAL).reduce((s,[k,v]) => s + (parseFloat(m[k])||0)*v, 0);
    }

    // Formula: given maintenance kcal, loss/week, and phase weight → compute protein/fat/carbs
    // deficit = lossPerWeek * 7700 / 7  (daily)
    // intake  = maintenance - deficit
    // protein = phaseWeight * 2.2
    // fat     = intake * 0.25 / 9
    // carbs   = (intake - protein*4 - fat*9) / 4
    function computeMacros(maintenance, lossPerWeek, phaseWeight) {
      const maint  = parseFloat(maintenance) || 0;
      const lpw    = parseFloat(lossPerWeek) || 0;
      const weight = parseFloat(phaseWeight) || 0;
      const dailyDeficit = lpw * 7700 / 7;
      const intake = maint - dailyDeficit;
      const protein = Math.round(weight * 2.2);
      const fat     = Math.round(intake * 0.25 / 9);
      const carbKcal = intake - protein * 4 - fat * 9;
      const carbs   = Math.max(0, Math.round(carbKcal / 4));
      return { protein, carbs, fat };
    }

    function effectiveMacros(phase) {
      // Use overrides where set, formula elsewhere
      const formula = computeMacros(phase.maintenance, phase.lossPerWeek, phase.phaseWeight);
      return {
        protein: phase.overrides?.protein !== undefined ? phase.overrides.protein : formula.protein,
        carbs:   phase.overrides?.carbs   !== undefined ? phase.overrides.carbs   : formula.carbs,
        fat:     phase.overrides?.fat     !== undefined ? phase.overrides.fat     : formula.fat,
        fiber:   phase.overrides?.fiber   !== undefined ? phase.overrides.fiber   : (phase.fiber || 25),
      };
    }

    function phaseKcal(phase) { return calcKcal(effectiveMacros(phase)); }

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
      d.setHours(0,0,0,0);
      return d;
    }
    function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }
    function addWeeks(date, n) { return addDays(date, n*7); }
    function fmt(d) { return d.toLocaleDateString("es-AR", { day:"2-digit", month:"short" }); }
    function fmtFull(d) { return d.toLocaleDateString("es-AR", { weekday:"short", day:"2-digit", month:"short" }); }
    function fmtRange(s) { const e = addDays(s,6); return `${fmt(s)} – ${fmt(e)}`; }
    function dateKey(d) { return d.toISOString().slice(0,10); }

    const DEFAULT_PHASES = [
      { id:1, type:"deficit",     label:"Cut 1",         weeks:6, maintenance:2200, lossPerWeek:0.75, phaseWeight:79, overrides:{}, fiber:25 },
      { id:2, type:"maintenance", label:"Maintenance 1", weeks:6, maintenance:2200, lossPerWeek:0,    phaseWeight:74, overrides:{}, fiber:30 },
      { id:3, type:"deficit",     label:"Cut 2",         weeks:6, maintenance:2200, lossPerWeek:0.75, phaseWeight:74, overrides:{}, fiber:25 },
    ];

    const fs = { border:"1px solid #ccc", borderRadius:4, padding:"4px 8px", fontSize:12, fontFamily:"inherit" };

    // ── Phase form ──
    function PhaseForm({ form, setForm, onSave, onCancel, color }) {
      const formula  = computeMacros(form.maintenance, form.lossPerWeek, form.phaseWeight);
      const macros   = effectiveMacros(form);
      const kcal     = calcKcal(macros);
      const dailyDef = (parseFloat(form.lossPerWeek)||0) * 7700 / 7;
      const intake   = (parseFloat(form.maintenance)||0) - dailyDef;

      function setOverride(m, val) {
        const v = val === "" ? undefined : parseFloat(val);
        const ov = { ...(form.overrides||{}) };
        if (v === undefined || isNaN(v)) delete ov[m]; else ov[m] = v;
        setForm(f => ({ ...f, overrides: ov }));
      }

      function clearOverride(m) {
        const ov = { ...(form.overrides||{}) };
        delete ov[m];
        setForm(f => ({ ...f, overrides: ov }));
      }

      const isOverridden = m => (form.overrides||{})[m] !== undefined;

      return (
        <div style={{ background:color.bg||"white", border:`1px solid ${color.border||"#ddd"}`, borderRadius:6, padding:"14px 16px" }}>
          {/* Row 1: basic fields */}
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:12 }}>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Label</div>
              <input value={form.label||""} onChange={e=>setForm(f=>({...f,label:e.target.value}))} style={{...fs,width:110}} />
            </div>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Type</div>
              <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={fs}>
                <option value="deficit">Deficit</option>
                <option value="maintenance">Maintenance</option>
              </select>
            </div>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Weeks</div>
              <input type="number" value={form.weeks||""} onChange={e=>setForm(f=>({...f,weeks:e.target.value}))} style={{...fs,width:52}} />
            </div>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Phase Start Weight (kg)</div>
              <input type="number" step="0.1" value={form.phaseWeight||""} onChange={e=>setForm(f=>({...f,phaseWeight:e.target.value}))} style={{...fs,width:80}} />
            </div>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Maintenance kcal</div>
              <input type="number" value={form.maintenance||""} onChange={e=>setForm(f=>({...f,maintenance:e.target.value}))} style={{...fs,width:80}} />
            </div>
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Loss / week (kg)</div>
              <input type="number" step="0.05" value={form.lossPerWeek||""} onChange={e=>setForm(f=>({...f,lossPerWeek:e.target.value}))} style={{...fs,width:70}} />
            </div>
            {/* Calculated summary */}
            <div style={{ fontSize:11, color:"#555", alignSelf:"flex-end", paddingBottom:6 }}>
              <span style={{ color:"#1a1a2e", fontWeight:500 }}>{Math.round(intake)} kcal/day</span>
              <span style={{ color:"#888" }}> · {Math.round(dailyDef)} kcal deficit</span>
            </div>
          </div>

          {/* Row 2: macros (formula-driven, overrideable) */}
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", padding:"10px 12px", background:"rgba(0,0,0,0.03)", borderRadius:4, marginBottom:10 }}>
            <div style={{ fontSize:10, color:"#888", alignSelf:"center", marginRight:4 }}>Macros (g/day)</div>
            {["protein","carbs","fat"].map(m => {
              const ov = isOverridden(m);
              return (
                <div key={m} style={{ position:"relative" }}>
                  <div style={{ fontSize:9, color: ov?"#f57c00":"#666", marginBottom:2 }}>
                    {MACRO_LABELS[m]}{ov?" (override)":""}
                    {ov && <span onClick={()=>clearOverride(m)} style={{ cursor:"pointer", marginLeft:4, color:"#e53935", fontSize:9 }}>✕</span>}
                  </div>
                  <input type="number" step="1"
                    value={ov ? (form.overrides||{})[m] : formula[m]}
                    onChange={e => setOverride(m, e.target.value)}
                    style={{...fs, width:65, background: ov?"#fffde7":"white", borderColor: ov?"#f9a825":"#ccc"}} />
                  {!ov && <div style={{ fontSize:8, color:"#aaa", marginTop:1 }}>auto</div>}
                </div>
              );
            })}
            {/* Fiber always manual */}
            <div>
              <div style={{ fontSize:9, color:"#666", marginBottom:2 }}>Fiber</div>
              <input type="number" step="1" value={form.fiber||25}
                onChange={e=>setForm(f=>({...f,fiber:parseFloat(e.target.value)||0}))}
                style={{...fs,width:55}} />
            </div>
            <div style={{ fontSize:11, color:"#333", alignSelf:"flex-end", paddingBottom:6, fontWeight:500 }}>
              = {kcal} kcal
              {" "}<span style={{ fontSize:10, color:"#888" }}>
                ({macros.protein}p / {macros.carbs}c / {macros.fat}f / {macros.fiber||form.fiber||25}fb)
              </span>
            </div>
          </div>

          <div style={{ display:"flex", gap:6 }}>
            <button className="btn" onClick={onSave} style={{ background:"#1a1a2e", color:"white" }}>Save</button>
            <button className="btn" onClick={onCancel} style={{ background:"#eee", color:"#333" }}>Cancel</button>
          </div>
        </div>
      );
    }

    // ── Day row ──

    // ── DayRow: owns all local field state, only syncs to parent on blur ──
    function DayRow({ date, phaseTargets, dayData, onChange }) {
      const dk = dateKey(date);
      // Local copy of day data — parent re-renders don't touch this
      // raw: stores strings while typing; committed: parsed values sent to parent
      const toStr = v => (v !== undefined && v !== null) ? String(v) : "";
      const [raw, setRaw] = useState(() => ({
        weight: toStr(dayData.weight),
        macros: Object.fromEntries(MACROS.map(m => [m, toStr((dayData.macros||{})[m])])),
        bio:    Object.fromEntries(["sodium","liquid","hrv","rhr","steps","sleepH","sleepM"].map(k => [k, toStr((dayData.bio||{})[k])])),
        notes:  dayData.notes || "",
      }));

      // Only re-init when switching to a different date
      const prevDk = useRef(dk);
      useEffect(() => {
        if (dk !== prevDk.current) {
          prevDk.current = dk;
          setRaw({
            weight: toStr(dayData.weight),
            macros: Object.fromEntries(MACROS.map(m => [m, toStr((dayData.macros||{})[m])])),
            bio:    Object.fromEntries(["sodium","liquid","hrv","rhr","steps","sleepH","sleepM"].map(k => [k, toStr((dayData.bio||{})[k])])),
            notes:  dayData.notes || "",
          });
        }
      }, [dk]);

      const commit = (newRaw) => {
        const p = v => { const n = parseFloat(v); return isNaN(n) ? undefined : n; };
        const macrosParsed = Object.fromEntries(MACROS.map(m => [m, p(newRaw.macros[m])]).filter(([,v]) => v !== undefined));
        const bioParsed    = Object.fromEntries(Object.entries(newRaw.bio).map(([k,v]) => [k, p(v)]).filter(([,v]) => v !== undefined));
        const weight       = p(newRaw.weight);
        const committed = { macros: macrosParsed, bio: bioParsed, notes: newRaw.notes || undefined };
        if (weight !== undefined) committed.weight = weight;
        const hasData = weight !== undefined || Object.keys(macrosParsed).length > 0 || Object.keys(bioParsed).length > 0 || newRaw.notes;
        onChange(hasData ? committed : { macros: {}, bio: {} });
      };

      // Typed value updates raw string; commit parses on blur
      const setWeight = v => { const r = {...raw, weight: v}; setRaw(r); };
      const setMacro  = (m, v) => { const r = {...raw, macros: {...raw.macros, [m]: v}}; setRaw(r); };
      const setBio    = (k, v) => { const r = {...raw, bio: {...raw.bio, [k]: v}}; setRaw(r); };
      const setNotes  = v => { const r = {...raw, notes: v}; setRaw(r); commit({...raw, notes: v}); };

      const onBlurWeight = () => commit(raw);
      const onBlurMacro  = () => commit(raw);
      const onBlurBio    = () => commit(raw);

      // For display/calculation use parsed values
      const p = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
      const macros = Object.fromEntries(MACROS.map(m => [m, p(raw.macros[m]) || undefined]).filter(([,v]) => v));
      const bio    = Object.fromEntries(Object.entries(raw.bio).map(([k,v]) => [k, p(v) || undefined]).filter(([,v]) => v));
      const kcal = calcKcal(macros);
      const targetKcal = calcKcal(phaseTargets);
      const kcalDiff = kcal > 0 ? kcal - targetKcal : null;

      const iStyle = { textAlign:"right", fontSize:10, fontFamily:"inherit", color:"#555",
        border:"none", borderBottom:"1px solid #e0e0e0", padding:"2px 4px",
        background:"transparent", outline:"none" };
      const inp = (rawVal, onCh, onBl, w) => (
        <input type="text" inputMode="decimal" placeholder="n/a"
          value={rawVal}
          onChange={e => onCh(e.target.value)}
          onBlur={onBl}
          style={{ ...iStyle, width: w || 52 }} />
      );

      return (
        <div className="day-row" style={{ borderBottom:"1px solid #f5f5f5" }}>
          {/* Nutrition row */}
          <div style={{ display:"grid", gridTemplateColumns:"110px 72px 68px 68px 68px 68px 90px", padding:"5px 16px 3px 44px", alignItems:"center" }}>
            <span style={{ fontSize:11, color:"#555", fontWeight:500 }}>{fmtFull(date)}</span>
            <span style={{ textAlign:"right", paddingRight:8 }}>
              {inp(raw.weight, setWeight, onBlurWeight, 56)}
            </span>
            {MACROS.map(m => (
              <span key={m} style={{ textAlign:"right", paddingRight:4 }}>
                {inp(raw.macros[m], v => setMacro(m, v), onBlurMacro, 54)}
              </span>
            ))}
            <span style={{ textAlign:"right", fontSize:11, paddingRight:4 }}>
              {kcal > 0 ? (
                <span>
                  <span style={{ color:"#333" }}>{kcal}</span>
                  {kcalDiff !== null && (
                    <span style={{ fontSize:10, marginLeft:3, color: kcalDiff>50?"#e53935":kcalDiff<-50?"#43a047":"#888" }}>
                      {kcalDiff>0?"+":""}{Math.round(kcalDiff)}
                    </span>
                  )}
                </span>
              ) : <span style={{ color:"#ccc" }}>—</span>}
            </span>
          </div>
          {/* Biometrics: 2-row x 3-col */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3, max-content)", gap:"2px 16px", padding:"3px 16px 7px 44px" }}>
                      {(()=>{
            const bioFields = [
              [["Sodium","mg","sodium"], ["HRV","ms","hrv"],  ["Steps","","steps"]],
              [["Liquid","L","liquid"],  ["RHR","bpm","rhr"], null],
            ];
            const bioInp = (key, w) => (
              <input type="text" inputMode="decimal" placeholder="n/a"
                value={raw.bio[key] || ""}
                onChange={e => setBio(key, e.target.value)}
                onBlur={onBlurBio}
                style={{ ...iStyle, width: w||52, textAlign:"right", fontSize:10, fontFamily:"inherit", color:"#555",
                  border:"none", borderBottom:"1px solid #e0e0e0", padding:"2px 4px", background:"transparent", outline:"none" }} />
            );
            return (
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3, max-content)", gap:"2px 16px", padding:"3px 16px 7px 44px" }}>
                {bioFields.map((row, ri) => row.map((cell, ci) => {
                  if (!cell) return (
                    <div key="sleep" style={{ display:"flex", alignItems:"center", gap:0 }}>
                      <span style={{ fontSize:9, color:"#bbb", textTransform:"uppercase", letterSpacing:1, width:46, flexShrink:0 }}>Sleep</span>
                      {bioInp("sleepH", 38)}
                      <span style={{ fontSize:9, color:"#ccc", width:16 }}>h</span>
                      {bioInp("sleepM", 38)}
                      <span style={{ fontSize:9, color:"#ccc", width:16 }}>m</span>
                    </div>
                  );
                  const [label, unit, key] = cell;
                  return (
                    <div key={key} style={{ display:"flex", alignItems:"center", gap:0 }}>
                      <span style={{ fontSize:9, color:"#bbb", textTransform:"uppercase", letterSpacing:1, width:46, flexShrink:0 }}>{label}</span>
                      {bioInp(key, key==="steps"?64:52)}
                      {unit && <span style={{ fontSize:9, color:"#ccc", width:28 }}>{unit}</span>}
                    </div>
                  );
                }))}
              </div>
            );
          })()}
          </div>
          {/* Notes */}
          <div style={{ padding:"2px 16px 6px 44px" }}>
            <textarea
              placeholder="Notes…"
              value={raw.notes}
              onChange={e => setNotes(e.target.value)}
              rows="1"
              style={{ width:"100%", fontSize:10, fontFamily:"inherit", color:"#555", background:"transparent", border:"none", borderBottom:"1px solid #e0e0e0", outline:"none", resize:"vertical", padding:"2px 0", lineHeight:1.5 }}
            />
          </div>
        </div>
      );
    }

    // ── Week row ──
    function WeekRow({ weekInPhase, weekStart, phase, projStart, projEnd, dayLogs, onDayChange, targetWeight }) {
      const [expanded, setExpanded] = useState(false);
      const c = COLORS[phase.type];
      const phaseTargets = effectiveMacros(phase);
      const targetKcal = calcKcal(phaseTargets);

      const days = Array.from({length:7}, (_,i) => addDays(weekStart, i));
      const weights = days.map(d => { const dd = dayLogs[dateKey(d)]; return dd?.weight !== undefined ? dd.weight : null; }).filter(w => w !== null);
      const avgWeight = (() => {
        if (weights.length === 0) return null;
        const s = [...weights].sort((a,b) => a-b);
        const m = Math.floor(s.length/2);
        return s.length % 2 === 0 ? (s[m-1]+s[m])/2 : s[m];
      })();

      const weekMacroTotals = MACROS.reduce((acc,m) => {
        acc[m] = days.reduce((s,d) => { const dd = dayLogs[dateKey(d)]; return s + (dd?.macros?.[m] ? parseFloat(dd.macros[m]) : 0); }, 0);
        return acc;
      }, {});
      const weekKcal = calcKcal(weekMacroTotals);

      const variance = avgWeight !== null ? avgWeight - projEnd : null;
      const hitTarget = projEnd <= targetWeight;

      return (
        <div>
          <div className="week-header" onClick={()=>setExpanded(e=>!e)}
            style={{ display:"grid", gridTemplateColumns:"170px 44px 90px 90px 90px 90px", padding:"7px 16px", borderBottom: expanded?"none":"1px solid #f0f0f0", background: expanded?c.rowBg:(avgWeight!==null?"rgba(129,199,132,0.06)":"white"), alignItems:"center" }}>
            <span style={{ fontSize:11, color:"#444", display:"flex", alignItems:"center", gap:6 }}>
              <span style={{ fontSize:10, color:"#bbb", display:"inline-block", transition:"transform 0.15s", transform:expanded?"rotate(90deg)":"rotate(0deg)" }}>▶</span>
              {fmtRange(weekStart)}
            </span>
            <span style={{ fontSize:11, color:"#999" }}>W{weekInPhase}</span>
            <span style={{ fontSize:11, textAlign:"right", color:"#888" }}>{projStart.toFixed(1)}</span>
            <span style={{ fontSize:11, textAlign:"right", color:hitTarget?"#43a047":"#333", fontWeight:hitTarget?600:400 }}>
              {projEnd.toFixed(1)}{hitTarget?" 🎯":""}
            </span>
            <span style={{ fontSize:11, textAlign:"right", color:avgWeight!==null?"#1a1a2e":"#ccc" }}>
              {avgWeight!==null ? avgWeight.toFixed(1) : "—"}
              {weights.length>0 && weights.length<7 && <span style={{ fontSize:9, color:"#aaa", marginLeft:2 }}>({weights.length}d)</span>}
            </span>
            <span style={{ fontSize:11, textAlign:"right", color:variance===null?"#ccc":variance>0.2?"#e53935":variance<-0.2?"#43a047":"#888" }}>
              {variance===null?"—":(variance>0?"+":"")+variance.toFixed(1)+" kg"}
            </span>
          </div>

          {expanded && (
            <div style={{ background:c.rowBg, borderBottom:"1px solid #e8e8e8" }}>
              {/* Day header */}
              <div style={{ display:"grid", gridTemplateColumns:"110px 72px 68px 68px 68px 68px 90px", padding:"4px 16px 4px 44px", fontSize:9, color:"#aaa", letterSpacing:1.2, textTransform:"uppercase", borderBottom:"1px solid #ececec" }}>
                <span>Day</span>
                <span style={{ textAlign:"right", paddingRight:8 }}>Weight</span>
                {MACROS.map(m => <span key={m} style={{ textAlign:"right", paddingRight:4 }}>{MACRO_LABELS[m]}</span>)}
                <span style={{ textAlign:"right", paddingRight:4 }}>kcal</span>
              </div>
              {days.map(d => (
                <DayRow key={dateKey(d)} date={d} phaseTargets={phaseTargets}
                  dayData={dayLogs[dateKey(d)] || { macros:{} }}
                  onChange={data => onDayChange(dateKey(d), data)} />
              ))}
              {/* Week totals */}
              <div style={{ display:"grid", gridTemplateColumns:"110px 72px 68px 68px 68px 68px 90px", padding:"6px 16px 6px 44px", borderTop:"1px solid #ddd", alignItems:"center", background:"rgba(0,0,0,0.03)" }}>
                <span style={{ fontSize:10, color:"#666", fontWeight:600, textTransform:"uppercase", letterSpacing:1 }}>Week Σ</span>
                <span style={{ textAlign:"right", paddingRight:8, fontSize:11, color:"#555" }}>
                  {avgWeight!==null ? `~${avgWeight.toFixed(1)}` : "—"}
                </span>
                {MACROS.map(m => {
                  const total = weekMacroTotals[m];
                  const target = (phaseTargets[m]||0)*7;
                  const diff = total>0 ? total-target : null;
                  return (
                    <span key={m} style={{ textAlign:"right", paddingRight:4, fontSize:11 }}>
                      {total>0 ? (
                        <span>
                          <span style={{ color:"#333" }}>{Math.round(total)}</span>
                          {diff!==null && <span style={{ fontSize:9, marginLeft:2, color:diff>10?"#e53935":diff<-10?"#43a047":"#888" }}>{diff>0?"+":""}{Math.round(diff)}</span>}
                        </span>
                      ) : <span style={{ color:"#ccc" }}>—</span>}
                    </span>
                  );
                })}
                <span style={{ textAlign:"right", paddingRight:4, fontSize:11 }}>
                  {weekKcal>0 ? (
                    <span>
                      <span style={{ color:"#333", fontWeight:500 }}>{Math.round(weekKcal)}</span>
                      {targetKcal>0 && <span style={{ fontSize:9, marginLeft:2, color:(weekKcal-targetKcal*7)>100?"#e53935":(weekKcal-targetKcal*7)<-100?"#43a047":"#888" }}>
                        {weekKcal-targetKcal*7>0?"+":""}{Math.round(weekKcal-targetKcal*7)}
                      </span>}
                    </span>
                  ) : <span style={{ color:"#ccc" }}>—</span>}
                </span>
              </div>
              {/* Target reminder */}
              <div style={{ padding:"4px 16px 6px 44px", fontSize:10, color:"#aaa" }}>
                Target: {MACROS.map(m=>`${phaseTargets[m]||0}g ${m}`).join(" · ")} · {targetKcal} kcal/day
              </div>
            </div>
          )}
        </div>
      );
    }


    // ── Weight Chart ──
    function WeightChart({ data, targetWeight }) {
      const [fromDate, setFromDate] = useState("");
      const [toDate,   setToDate]   = useState("");
      const svgRef = useRef(null);

      const filtered = useMemo(() => {
        let d = data;
        if (fromDate) d = d.filter(p => p.date >= new Date(fromDate+"T00:00:00"));
        if (toDate)   d = d.filter(p => p.date <= new Date(toDate+"T23:59:59"));
        return d;
      }, [data, fromDate, toDate]);

      if (filtered.length === 0) return (
        <div style={{ padding:20, color:"#aaa", fontSize:12, textAlign:"center" }}>No data in range</div>
      );

      const W = 320, H = 260, PAD = { top:16, right:16, bottom:40, left:40 };
      const cw = W - PAD.left - PAD.right;
      const ch = H - PAD.top  - PAD.bottom;

      const allVals = [
        ...filtered.map(d=>d.proj),
        ...filtered.map(d=>d.actual).filter(v=>v!==null),
        targetWeight
      ];
      const minV = Math.floor(Math.min(...allVals) - 0.5);
      const maxV = Math.ceil( Math.max(...allVals) + 0.5);
      const n    = filtered.length;

      function x(i)  { return PAD.left + (i/(n-1||1))*cw; }
      function y(v)  { return PAD.top  + (1-(v-minV)/(maxV-minV))*ch; }

      // Build SVG paths
      const projPath = filtered.map((d,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(d.proj).toFixed(1)}`).join(" ");
      const actualSegs = [];
      let seg = [];
      for (let i=0; i<filtered.length; i++) {
        if (filtered[i].actual !== null) { seg.push(i); }
        else { if (seg.length>0) { actualSegs.push(seg); seg=[]; } }
      }
      if (seg.length>0) actualSegs.push(seg);
      const actualPaths = actualSegs.map(s => s.map((i,j)=>`${j===0?"M":"L"}${x(i).toFixed(1)},${y(filtered[i].actual).toFixed(1)}`).join(" "));

      // Y axis ticks
      const yTicks = [];
      for (let v=minV; v<=maxV; v+=1) yTicks.push(v);

      // X axis labels — show every Nth
      const step = Math.max(1, Math.ceil(n/6));
      const xLabels = filtered.map((d,i) => i%step===0||i===n-1 ? { i, label:d.label } : null).filter(Boolean);

      const targetY = y(targetWeight);

      return (
        <div style={{ background:"white", borderRadius:6, border:"1px solid #e8e8e8", padding:"14px 14px 10px" }}>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:2, color:"#888", textTransform:"uppercase", marginBottom:10 }}>Weight Chart</div>

          {/* Date pickers */}
          <div style={{ display:"flex", gap:8, marginBottom:12, alignItems:"center" }}>
            <div style={{ fontSize:9, color:"#aaa", textTransform:"uppercase", letterSpacing:1 }}>From</div>
            <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
              style={{ border:"1px solid #ddd", borderRadius:3, padding:"3px 6px", fontSize:11, fontFamily:"inherit" }} />
            <div style={{ fontSize:9, color:"#aaa", textTransform:"uppercase", letterSpacing:1 }}>To</div>
            <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
              style={{ border:"1px solid #ddd", borderRadius:3, padding:"3px 6px", fontSize:11, fontFamily:"inherit" }} />
            {(fromDate||toDate) && <button onClick={()=>{setFromDate("");setToDate("");}} style={{ fontSize:10, color:"#999", background:"none", border:"none", cursor:"pointer" }}>✕ clear</button>}
          </div>

          {/* SVG */}
          <svg width={W} height={H} style={{ display:"block", overflow:"visible" }}>
            {/* Grid lines + Y labels */}
            {yTicks.map(v => (
              <g key={v}>
                <line x1={PAD.left} x2={PAD.left+cw} y1={y(v)} y2={y(v)} stroke="#f0f0f0" strokeWidth="1" />
                <text x={PAD.left-6} y={y(v)+4} textAnchor="end" fontSize="9" fill="#bbb" fontFamily="DM Mono,monospace">{v}</text>
              </g>
            ))}

            {/* Target weight dashed line */}
            {targetWeight >= minV && targetWeight <= maxV && (
              <g>
                <line x1={PAD.left} x2={PAD.left+cw} y1={targetY} y2={targetY} stroke="#ffb74d" strokeWidth="1" strokeDasharray="4,3" />
                <text x={PAD.left+cw+4} y={targetY+4} fontSize="9" fill="#ffb74d" fontFamily="DM Mono,monospace">{targetWeight}</text>
              </g>
            )}

            {/* Projected line — light green */}
            <path d={projPath} fill="none" stroke="#a5d6a7" strokeWidth="2" strokeLinejoin="round" />

            {/* Actual line — light blue */}
            {actualPaths.map((p,i) => (
              <path key={i} d={p} fill="none" stroke="#90caf9" strokeWidth="2.5" strokeLinejoin="round" />
            ))}

            {/* Actual dots */}
            {filtered.map((d,i) => d.actual!==null && (
              <circle key={i} cx={x(i)} cy={y(d.actual)} r="3" fill="#64b5f6" />
            ))}

            {/* X labels */}
            {xLabels.map(({i,label}) => (
              <text key={i} x={x(i)} y={H-6} textAnchor="middle" fontSize="9" fill="#bbb" fontFamily="DM Mono,monospace">{label}</text>
            ))}
          </svg>

          {/* Legend */}
          <div style={{ display:"flex", gap:16, marginTop:4 }}>
            <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:10, color:"#888" }}>
              <svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#a5d6a7" strokeWidth="2"/></svg>
              Projected
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:10, color:"#888" }}>
              <svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#90caf9" strokeWidth="2.5"/></svg>
              Logged
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:10, color:"#888" }}>
              <svg width="20" height="4"><line x1="0" y1="2" x2="20" y2="2" stroke="#ffb74d" strokeWidth="1" strokeDasharray="4,3"/></svg>
              Target
            </div>
          </div>
        </div>
      );
    }

    // ── Main app ──
    function Tracker() {
      const [loaded,       setLoaded]       = useState(false);
      const [startDateStr, setStartDateStr] = useState("2026-03-16");
      const [startWeight,  setStartWeight]  = useState(79.0);
      const [targetWeight, setTargetWeight] = useState(70.0);
      const [phases,       setPhases]       = useState(DEFAULT_PHASES);
      const [dayLogs,      setDayLogs]      = useState({});
      const [nextId,       setNextId]       = useState(10);
      const [editingPhase, setEditingPhase] = useState(null);
      const [editForm,     setEditForm]     = useState({});
      const [newPhase,     setNewPhase]     = useState({ type:"deficit", label:"", weeks:6, maintenance:2200, lossPerWeek:0.75, phaseWeight:79, overrides:{}, fiber:25 });
      const [showAdd,      setShowAdd]      = useState(false);
      const [saveStatus,   setSaveStatus]   = useState("saved");
      const [dragIdx,      setDragIdx]      = useState(null);
      const [dragOverIdx,  setDragOverIdx]  = useState(null);
      const saveTimeout  = useRef(null);
      const currentState = useRef({});

      useEffect(() => {
        sbGet().then(data => {
          if (data) {
            if (data.startDateStr) setStartDateStr(data.startDateStr);
            if (data.startWeight  != null) setStartWeight(data.startWeight);
            if (data.targetWeight != null) setTargetWeight(data.targetWeight);
            if (data.phases)  setPhases(data.phases);
            if (data.dayLogs) setDayLogs(data.dayLogs);
            if (data.nextId)  setNextId(data.nextId);
          }
          setLoaded(true);
        });
      }, []);

      useEffect(() => {
        currentState.current = { startDateStr, startWeight, targetWeight, phases, dayLogs, nextId };
      }, [startDateStr, startWeight, targetWeight, phases, dayLogs, nextId]);

      function scheduleSave(patch) {
        const next = { ...currentState.current, ...patch };
        currentState.current = next;
        setSaveStatus("saving");
        if (saveTimeout.current) clearTimeout(saveTimeout.current);
        saveTimeout.current = setTimeout(async () => {
          const ok = await sbSave(currentState.current);
          setSaveStatus(ok ? "saved" : "error");
        }, 900);
      }

      const startDate = useMemo(() => getMonday(new Date(startDateStr+"T12:00:00")), [startDateStr]);

      const weeks = useMemo(() => {
        const r = []; let wi = 0;
        for (const p of phases)
          for (let w = 0; w < p.weeks; w++)
            r.push({ phaseId:p.id, phaseLabel:p.label, type:p.type, phase:p, weekInPhase:w+1, globalWeek:++wi });
        return r;
      }, [phases]);

      const projectedWeights = useMemo(() => {
        const r = [];
        for (let i = 0; i < weeks.length; i++) {
          const w = weeks[i];
          const weekStart = addWeeks(startDate, i);
          const days = Array.from({length:7}, (_,d) => addDays(weekStart, d));
          const weights = days.map(d => { const dd = dayLogs[dateKey(d)]; return dd?.weight !== undefined ? dd.weight : null; }).filter(x => x!==null);
          const avgW = (() => {
            if (weights.length === 0) return null;
            const s = [...weights].sort((a,b) => a-b);
            const m = Math.floor(s.length/2);
            return s.length % 2 === 0 ? (s[m-1]+s[m])/2 : s[m];
          })();
          const lpw = parseFloat(w.phase.lossPerWeek)||0;
          // projStart: use previous week's actual avg if available, otherwise previous projEnd
          const prevActual = i===0 ? null : r[i-1].actualAvg;
          const prev = i===0 ? startWeight : (prevActual!==null ? prevActual : r[i-1].projEnd);
          const projEnd = prev - lpw;
          r.push({ start: prev, projEnd, actualAvg: avgW });
        }
        return r;
      }, [weeks, dayLogs, startDate, startWeight]);

      function handleDayChange(dateStr, data) {
        const nl = { ...dayLogs, [dateStr]: data };
        if (!data.weight && (!data.macros || Object.keys(data.macros).length===0)) delete nl[dateStr];
        setDayLogs(nl); scheduleSave({ dayLogs:nl });
      }

      function saveEdit() {
        const updated = phases.map(p => p.id===editingPhase
          ? { ...editForm, id:p.id, weeks:parseInt(editForm.weeks), maintenance:parseFloat(editForm.maintenance),
              lossPerWeek:parseFloat(editForm.lossPerWeek)||0, phaseWeight:parseFloat(editForm.phaseWeight)||0,
              overrides: editForm.overrides||{}, fiber:parseFloat(editForm.fiber)||25 }
          : p);
        setEditingPhase(null); setPhases(updated); scheduleSave({ phases:updated });
      }

      function delPhase(id) { const u=phases.filter(p=>p.id!==id); setPhases(u); scheduleSave({ phases:u }); }

      function addPhase() {
        const id = nextId;
        const np = { ...newPhase, id, weeks:parseInt(newPhase.weeks), maintenance:parseFloat(newPhase.maintenance),
          lossPerWeek:parseFloat(newPhase.lossPerWeek)||0, phaseWeight:parseFloat(newPhase.phaseWeight)||0,
          overrides:newPhase.overrides||{}, fiber:parseFloat(newPhase.fiber)||25 };
        const updated = [...phases, np];
        setNewPhase({ type:"deficit", label:"", weeks:6, maintenance:2200, lossPerWeek:0.75, phaseWeight:79, overrides:{}, fiber:25 });
        setShowAdd(false); setPhases(updated); setNextId(id+1);
        scheduleSave({ phases:updated, nextId:id+1 });
      }

      function handleDrop(e, dropIdx) {
        e.preventDefault();
        if (dragIdx===null || dragIdx===dropIdx) { setDragIdx(null); setDragOverIdx(null); return; }
        const newP = [...phases];
        const [moved] = newP.splice(dragIdx, 1); newP.splice(dropIdx, 0, moved);
        setDragIdx(null); setDragOverIdx(null); setPhases(newP); scheduleSave({ phases:newP });
      }

      const finalWeight = projectedWeights.length>0 ? projectedWeights[projectedWeights.length-1].projEnd : startWeight;
      const remaining   = finalWeight - targetWeight;

      const phaseGroups = useMemo(() => {
        const g = []; let cur = null;
        for (let i=0; i<weeks.length; i++) {
          const w = weeks[i];
          if (!cur || cur.phaseId!==w.phaseId) { cur={ phaseId:w.phaseId, label:w.phaseLabel, type:w.type, phase:w.phase, weeks:[] }; g.push(cur); }
          cur.weeks.push({ ...w, idx:i });
        }
        return g;
      }, [weeks]);

      const statusColor = saveStatus==="saved"?"#81c784":saveStatus==="saving"?"#ffb74d":"#e57373";
      const statusText  = saveStatus==="saved"?"✓ Saved":saveStatus==="saving"?"Saving…":"⚠ Error";


      // ── Chart data ──
      const chartData = useMemo(() => {
        return weeks.map((w, i) => {
          const weekStart = addWeeks(startDate, i);
          return {
            label: fmt(weekStart),
            date: weekStart,
            proj: projectedWeights[i].projEnd,
            actual: projectedWeights[i].actualAvg,
          };
        });
      }, [weeks, projectedWeights, startDate]);

      if (!loaded) return <div style={{ padding:40, color:"#888" }}>Connecting to database…</div>;

      return (
        <div style={{ minHeight:"100vh", paddingBottom:80 }}>

          {/* Header */}
          <div style={{ background:"#1a1a2e", color:"#f8f7f4", padding:"28px 32px 22px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
              <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:3, color:"#666", textTransform:"uppercase" }}>Fat Loss Tracker</div>
              <div style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:statusColor }}>{statusText}</div>
            </div>
            <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:26, fontWeight:600, marginBottom:16 }}>
              {startWeight}kg → <span style={{ color:"#81c784" }}>{finalWeight.toFixed(1)}kg</span>
              {" "}<span style={{ fontSize:14, color:remaining<=0.1?"#81c784":"#ffb74d" }}>
                {remaining<=0.1?"✓ Target reached":`(${remaining.toFixed(1)}kg short of ${targetWeight}kg)`}
              </span>
            </div>
            <div style={{ display:"flex", gap:28, flexWrap:"wrap" }}>
              {[["Target",`${targetWeight} kg`],["Weeks",weeks.length],["Planned loss",`${(startWeight-finalWeight).toFixed(1)} kg`],["Starts",fmt(startDate)]].map(([l,v]) => (
                <div key={l}>
                  <div style={{ fontSize:9, color:"#666", letterSpacing:2, textTransform:"uppercase", marginBottom:2 }}>{l}</div>
                  <div style={{ fontSize:17, fontWeight:500 }}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ padding:"22px 32px", display:"flex", gap:28, alignItems:"flex-start" }}>
            <div style={{ flex:"1 1 0", minWidth:0 }}>

            {/* Settings */}
            <div style={{ display:"flex", gap:14, marginBottom:26, flexWrap:"wrap", alignItems:"flex-end" }}>
              {[
                { label:"Start Date (Monday)", type:"date",   value:startDateStr, set:v=>{ setStartDateStr(v); scheduleSave({startDateStr:v}); }, w:"auto" },
                { label:"Starting Weight (kg)", type:"number", value:startWeight,  set:v=>{ const n=parseFloat(v); setStartWeight(n); scheduleSave({startWeight:n}); }, w:88, step:"0.1" },
                { label:"Target Weight (kg)",   type:"number", value:targetWeight,  set:v=>{ const n=parseFloat(v); setTargetWeight(n); scheduleSave({targetWeight:n}); }, w:88, step:"0.1" },
              ].map(f => (
                <div key={f.label}>
                  <div style={{ fontSize:9, color:"#888", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>{f.label}</div>
                  <input type={f.type} step={f.step} value={f.value} onChange={e=>f.set(e.target.value)}
                    style={{...fs, padding:"6px 10px", fontSize:13, width:f.w, background:"white"}} />
                </div>
              ))}
            </div>

            {/* Phases */}
            <div style={{ marginBottom:30 }}>
              <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:3, color:"#888", textTransform:"uppercase", marginBottom:10 }}>
                Phases — <span style={{ color:"#bbb" }}>drag to reorder</span>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                {phases.map((phase, pi) => {
                  const c = COLORS[phase.type];
                  const macros = effectiveMacros(phase);
                  const kcal = calcKcal(macros);
                  const lpw = parseFloat(phase.lossPerWeek)||0;
                  const hasOverrides = Object.keys(phase.overrides||{}).length > 0;
                  if (editingPhase===phase.id) return (
                    <PhaseForm key={phase.id} form={editForm} setForm={setEditForm} color={c}
                      onSave={saveEdit} onCancel={()=>setEditingPhase(null)} />
                  );
                  return (
                    <div key={phase.id} className={dragOverIdx===pi && dragIdx!==pi?"drag-over":""}
                      draggable
                      onDragStart={e=>{ setDragIdx(pi); e.dataTransfer.effectAllowed="move"; }}
                      onDragOver={e=>{ e.preventDefault(); setDragOverIdx(pi); }}
                      onDrop={e=>handleDrop(e,pi)}
                      onDragEnd={()=>{ setDragIdx(null); setDragOverIdx(null); }}
                      style={{ background:c.bg, border:`1px solid ${c.border}`, borderRadius:6, padding:"9px 14px", display:"flex", alignItems:"center", justifyContent:"space-between", opacity:dragIdx===pi?0.35:1, cursor:"grab" }}>
                      <div style={{ display:"flex", gap:14, alignItems:"center", flexWrap:"wrap" }}>
                        <span style={{ color:"#bbb", fontSize:16 }}>⠿</span>
                        <span style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:500, fontSize:13, color:c.text, minWidth:90 }}>{phase.label}</span>
                        <span style={{ fontSize:11, color:"#666" }}>{phase.weeks}w</span>
                        <span style={{ fontSize:11, color:"#666" }}>~{phase.phaseWeight}kg start</span>
                        <span style={{ fontSize:11, color:"#555" }}>{kcal} kcal/day</span>
                        <span style={{ fontSize:11, color:"#666" }}>{macros.protein}p/{macros.carbs}c/{macros.fat}f/{macros.fiber}fb</span>
                        <span style={{ fontSize:11, color:lpw>0?"#43a047":"#888" }}>
                          {lpw>0?`-${lpw}`:0} kg/w
                        </span>
                        {hasOverrides && <span style={{ fontSize:10, color:"#f57c00" }}>⚠ overrides</span>}
                      </div>
                      <div style={{ display:"flex", gap:5 }}>
                        <button className="btn" onClick={()=>{ setEditingPhase(phase.id); setEditForm({...phase, overrides:{...(phase.overrides||{})}}); }} style={{ background:"#1a1a2e", color:"white" }}>Edit</button>
                        <button className="btn" onClick={()=>delPhase(phase.id)} style={{ background:"#ffeaea", color:"#c62828" }}>Delete</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop:8 }}>
                {!showAdd ? (
                  <button className="btn" onClick={()=>setShowAdd(true)} style={{ background:"#1a1a2e", color:"white", padding:"6px 14px" }}>+ Add Phase</button>
                ) : (
                  <PhaseForm form={newPhase} setForm={setNewPhase} color={{ bg:"white", border:"#ddd" }}
                    onSave={addPhase} onCancel={()=>setShowAdd(false)} />
                )}
              </div>
            </div>

            {/* Weekly log */}
            <div>
              <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:10, letterSpacing:3, color:"#888", textTransform:"uppercase", marginBottom:10 }}>Weekly Log</div>
              <div style={{ display:"grid", gridTemplateColumns:"170px 44px 90px 90px 90px 90px", padding:"5px 16px", fontSize:9, color:"#999", letterSpacing:1.5, textTransform:"uppercase", borderBottom:"1px solid #e0e0e0" }}>
                <span>Week</span><span>Wk</span>
                <span style={{ textAlign:"right" }}>Proj.&#8203;Start</span>
                <span style={{ textAlign:"right" }}>Proj.&#8203;End</span>
                <span style={{ textAlign:"right" }}>Avg&#8203;Weight</span>
                <span style={{ textAlign:"right" }}>Variance</span>
              </div>
              {phaseGroups.map(group => {
                const c = COLORS[group.type];
                return (
                  <div key={group.phaseId} style={{ marginBottom:3 }}>
                    <div style={{ background:c.bg, borderLeft:`3px solid ${c.border}`, padding:"4px 12px", fontSize:10, color:c.text, fontFamily:"'DM Sans',sans-serif", fontWeight:600, letterSpacing:1.5, textTransform:"uppercase" }}>
                      {group.label}
                    </div>
                    {group.weeks.map(({ globalWeek, weekInPhase, idx }) => {
                      const weekStart = addWeeks(startDate, idx);
                      return (
                        <WeekRow key={globalWeek}
                          weekInPhase={weekInPhase}
                          weekStart={weekStart}
                          phase={group.phase}
                          projStart={projectedWeights[idx].start}
                          projEnd={projectedWeights[idx].projEnd}
                          dayLogs={dayLogs}
                          onDayChange={(dateStr, data) => handleDayChange(dateStr, data)}
                          targetWeight={targetWeight}
                        />
                      );
                    })}
                  </div>
                );
              })}
            </div>
            </div>{/* end left col */}
            <div style={{ width:352, flexShrink:0, position:"sticky", top:20 }}>
              <WeightChart data={chartData} targetWeight={targetWeight} />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Tracker />);
  </script>
</body>
</html>
